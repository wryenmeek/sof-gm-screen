<!doctype html>
<html>
  <head>
    <base target="_top" />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/minisearch@7.1.2/dist/umd/index.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Outfit:wght@400;500;600;700&family=Fira+Code:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0b0f19;
        --sidebar-bg: #111827;
        --card-bg: #1e293b;
        --border: #334155;
        --gold: #f59e0b;
        --gold-light: #fbbf24;
        --cyan: #38bdf8;
        --text: #f8fafc;
        --text-muted: #94a3b8;
        --dnd-red: #e11d48;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        display: flex;
        height: 100vh;
        font-family:
          "Outfit",
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        overflow: hidden;
      }

      /* Sidebar Layout */
      #sidebar {
        width: 320px;
        background: var(--sidebar-bg);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        height: 100vh;
        flex-shrink: 0;
      }

      .sidebar-section {
        padding: 12px;
        overflow-y: auto;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .brand-header {
        font-family: "Cinzel", serif;
        font-size: 14px;
        font-weight: 900;
        color: var(--gold-light);
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--border);
        padding-bottom: 8px;
      }

      .session-control-row {
        display: flex;
        gap: 6px;
        align-items: center;
      }

      #session-select {
        flex: 1;
        background: #0f172a;
        color: var(--cyan);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 5px 8px;
        font-size: 13px;
        font-weight: 600;
        font-family: "Fira Code", monospace;
        cursor: pointer;
      }

      #filter-input {
        width: 100%;
        background: #0f172a;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 5px 8px;
        font-size: 12px;
        outline: none;
      }
      #filter-input:focus {
        border-color: var(--cyan);
      }

      /* File List */
      #file-list {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }

      .file-item {
        padding: 6px 10px;
        cursor: pointer;
        border-radius: 4px;
        font-size: 12.5px;
        word-break: break-all;
        transition: all 0.15s;
        display: flex;
        align-items: flex-start;
        gap: 6px;
        color: var(--text-muted);
        line-height: 1.3;
      }
      .file-item:hover {
        background: #1e293b;
        color: #ffffff;
      }
      .file-item.active {
        background: #1e293b;
        color: var(--gold-light);
        font-weight: 600;
        border-left: 3px solid var(--gold);
      }

      .file-icon {
        font-size: 14px;
        flex-shrink: 0;
        margin-top: 1px;
      }

      /* Scratchpad Drawer */
      #scratchpad-container {
        border-top: 1px solid var(--border);
        padding: 10px 12px;
        display: flex;
        flex-direction: column;
        height: 40%;
        background: #0d131f;
      }

      .scratchpad-header {
        font-size: 11.5px;
        font-weight: 700;
        color: var(--gold);
        display: flex;
        justify-content: space-between;
        margin-bottom: 6px;
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }

      #scratchpad {
        flex: 1;
        width: 100%;
        background: #090d16;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 8px;
        font-family: "Fira Code", monospace;
        font-size: 11.5px;
        line-height: 1.4;
        resize: none;
        outline: none;
      }
      #scratchpad:focus {
        border-color: var(--gold);
      }

      .scratchpad-controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 6px;
      }

      #save-status {
        font-size: 11px;
        color: var(--text-muted);
      }

      /* Workspace & Split Panes */
      #workspace {
        flex: 1;
        display: flex;
        height: 100vh;
        overflow: hidden;
      }

      .pane {
        flex: 1;
        display: flex;
        flex-direction: column;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
      }

      #right-pane {
        border-left: 1px solid var(--border);
        display: none;
        background: #070a10;
      }

      .pane-toolbar {
        height: 44px;
        background: #0f172a;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 16px;
        font-size: 13.5px;
        font-weight: 600;
        color: var(--silver);
      }

      .pane-content {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
      }

      /* Buttons */
      button {
        background: #1e293b;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 4px 10px;
        font-size: 12px;
        cursor: pointer;
        transition: background 0.15s;
      }
      button:hover {
        background: #334155;
        border-color: var(--cyan);
      }
      button.primary {
        background: var(--gold);
        border-color: var(--gold);
        color: #000;
        font-weight: 700;
      }
      button.primary:hover {
        background: var(--gold-light);
      }

      /* Rendered Assets */
      iframe.sandbox-frame {
        width: 100%;
        height: calc(100vh - 90px);
        border: none;
        background: #ffffff;
        border-radius: 6px;
      }

      img.asset-img {
        max-width: 100%;
        height: auto;
        border-radius: 6px;
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.5);
        display: block;
        margin: 0 auto;
      }

      /* Markdown Styling */
      .markdown-body {
        line-height: 1.6;
        max-width: 860px;
        margin: 0 auto;
      }
      .markdown-body h1,
      .markdown-body h2,
      .markdown-body h3 {
        font-family: "Cinzel", serif;
        color: var(--gold-light);
        border-bottom: 1px solid var(--border);
        padding-bottom: 4px;
        margin-top: 1.25rem;
        margin-bottom: 0.6rem;
      }
      .markdown-body p,
      .markdown-body li {
        color: #cbd5e1;
        margin-bottom: 0.6rem;
      }
      .markdown-body pre {
        background: #0f172a;
        border: 1px solid var(--border);
        padding: 12px;
        border-radius: 6px;
        overflow-x: auto;
        font-family: "Fira Code", monospace;
        color: #e2e8f0;
        margin: 1rem 0;
      }
      .markdown-body table {
        width: 100%;
        border-collapse: collapse;
        margin: 1rem 0;
        background: #111827;
        border-radius: 4px;
        overflow: hidden;
      }
      .markdown-body th,
      .markdown-body td {
        border: 1px solid var(--border);
        padding: 6px 10px;
      }
      .markdown-body th {
        background: #1e293b;
        color: var(--gold-light);
      }
      .markdown-body tr:nth-child(even) td {
        background: rgba(255, 255, 255, 0.02);
      }

      /* 5e Statblock Theme for Markdown Monsters */
      .dnd-statblock {
        background: #161b26;
        border: 2px solid var(--gold);
        border-radius: 8px;
        padding: 1.2rem 1.5rem;
        margin: 1.5rem 0;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      }
      .dnd-statblock h2 {
        font-family: "Cinzel", serif;
        font-size: 1.6rem;
        color: var(--gold-light);
        border-bottom: 2px solid var(--gold);
        margin: 0 0 4px;
        padding: 0;
      }
      .dnd-statblock em {
        color: var(--text-muted);
        display: block;
        margin-bottom: 8px;
        font-size: 0.95rem;
      }
      .dnd-statblock hr {
        border: none;
        height: 2px;
        background: linear-gradient(90deg, var(--gold), transparent);
        margin: 10px 0;
      }
      .dnd-statblock table {
        background: #0f172a;
        text-align: center;
        margin: 8px 0;
      }
      .dnd-statblock th {
        color: var(--cyan);
        font-size: 0.85rem;
        text-align: center;
      }
      .dnd-statblock td {
        font-family: "Fira Code", monospace;
        color: #ffffff;
        font-weight: 600;
      }
      .dnd-statblock h3 {
        font-family: "Cinzel", serif;
        font-size: 1.2rem;
        color: var(--dnd-red);
        border-bottom: 1px solid var(--border);
        margin-top: 14px;
      }
      .dnd-prop {
        margin-bottom: 4px;
        font-size: 0.92rem;
      }
      .dnd-prop strong {
        color: var(--gold-light);
      }
      #audio-cache-status {
        font-size: 11px;
        color: var(--cyan);
        font-family: "Fira Code", monospace;
      }

      #player-hud {
        display: none;
        flex-direction: column;
        width: 100%;
        min-height: 100vh;
        padding: 16px;
        background: var(--bg);
        color: var(--text);
        gap: 16px;
      }

      .mobile-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--border);
        padding-bottom: 10px;
      }

      .id-modal {
        background: #111827;
        border: 1px solid var(--gold);
        border-radius: 8px;
        padding: 12px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      #ptt-btn {
        background: #1d4ed8;
        color: #ffffff;
        font-size: 16px;
        font-weight: 700;
        padding: 16px;
        border-radius: 10px;
        border: none;
      }
      #ptt-btn.listening {
        background: var(--dnd-red);
      }

      #rule-card {
        display: none;
        background: #161b26;
        border: 2px solid var(--gold);
        border-radius: 10px;
        padding: 16px;
      }

      @media (width <= 768px) {
        #sidebar,
        #workspace {
          display: none;
        }
        #player-hud {
          display: flex;
        }
      }

      @media print {
        body {
          background: #ffffff;
          color: #000000;
          overflow: visible;
        }
        #sidebar {
          display: none;
        }
        table,
        td {
          background: #ffffff;
          color: #000000;
        }
      }
    </style>
  </head>
  <body>
    <!-- Left Sidebar -->
    <div id="sidebar">
      <div class="sidebar-section">
        <div class="brand-header">
          <span>⚔️ Sea of Fortune GM</span>
          <button onclick="refreshManifest()" title="Refresh files">↻</button>
        </div>

        <div class="session-control-row">
          <select id="session-select" onchange="switchSession(this.value)">
            <option value="<?= sessionDate ?>"><?= sessionDate ?></option>
          </select>
        </div>

        <input
          type="text"
          id="filter-input"
          placeholder="🔍 Filter maps, statblocks, notes..."
          oninput="filterFiles(this.value)"
        />
        <div id="audio-cache-status">Audio: 0/0 ready</div>

        <div id="file-list">Loading files...</div>
      </div>

      <!-- Scratchpad Drawer -->
      <div id="scratchpad-container">
        <div class="scratchpad-header">
          <span id="scratchpad-label">table_notes.md (<?= sessionDate ?>)</span>
        </div>
        <textarea
          id="scratchpad"
          placeholder="Loading session table notes..."
        ></textarea>
        <div class="scratchpad-controls">
          <span id="save-status">Loading...</span>
          <button class="primary" onclick="saveNotes()">Save (Ctrl+S)</button>
        </div>
      </div>
    </div>

    <!-- Workspace -->
    <div id="workspace">
      <!-- Left Primary Pane -->
      <div id="left-pane" class="pane">
        <div class="pane-toolbar">
          <span id="left-title">No file selected</span>
          <button
            id="pin-btn"
            style="display: none"
            onclick="pinCurrentToRight()"
          >
            Pin to Right ➔
          </button>
        </div>
        <div id="left-content" class="pane-content">
          <p
            style="
              color: var(--text-muted);
              text-align: center;
              margin-top: 20vh;
            "
          >
            Select any floor map, encounter dossier, statblock, or audio log
            from the sidebar to begin.
          </p>
        </div>
      </div>

      <!-- Right Pinned Pane -->
      <div id="right-pane" class="pane">
        <div class="pane-toolbar">
          <span id="right-title">Pinned Asset</span>
          <button onclick="unpinRight()">✕ Close Split</button>
        </div>
        <div id="right-content" class="pane-content"></div>
      </div>
    </div>

    <!-- Mobile Player Companion HUD (Tickets 07 & 08) -->
    <div id="player-hud">
      <header class="mobile-header">
        <span
          style="
            font-family: Cinzel, serif;
            color: var(--gold-light);
            font-weight: 900;
          "
          >⚔️ Sea of Fortune</span
        >
        <span id="player-tag">Player: Guest</span>
      </header>

      <div id="identity-modal" class="id-modal">
        <button
          class="id-btn"
          data-player="Pog"
          onclick="selectPlayerIdentity('Pog')"
        >
          Pog
        </button>
        <button
          class="id-btn"
          data-player="Vaelor"
          onclick="selectPlayerIdentity('Vaelor')"
        >
          Vaelor
        </button>
        <button
          class="id-btn"
          data-player="Orca"
          onclick="selectPlayerIdentity('Orca')"
        >
          Orca
        </button>
        <button
          class="id-btn"
          data-player="Fade"
          onclick="selectPlayerIdentity('Fade')"
        >
          Fade
        </button>
        <button
          class="id-btn"
          data-player="Guest"
          onclick="selectPlayerIdentity('Guest')"
        >
          Guest
        </button>
      </div>

      <button id="ptt-btn" onclick="triggerPtt()">🎙️ Tap to Ask Rule</button>

      <div id="rule-card">
        <h2 id="card-title">Rule Title</h2>
        <div id="card-type">Mechanic</div>
        <p id="card-text">Rule description...</p>
        <div style="display: flex; gap: 8px; margin-top: 12px">
          <button
            id="btn-up"
            class="primary"
            onclick="submitRuleFeedback('+1')"
          >
            👍 Helpful
          </button>
          <button id="btn-down" onclick="submitRuleFeedback('-1')">
            👎 Irrelevant
          </button>
          <button id="btn-dismiss" onclick="dismissRuleCard()">
            ✕ Dismiss
          </button>
        </div>
      </div>
    </div>

    <script>
      let currentSessionDate = "<?= sessionDate ?>";
      const cache = {};
      let allFiles = [];
      let currentLeftPayload = null;
      let miniSearch = null;

      // Configure marked for tables and line breaks
      marked.setOptions({
        gfm: true,
        breaks: true
      });

      window.onload = () => {
        loadSessionDropdown();
        refreshManifest();
        loadScratchpad();
      };

      // Keyboard shortcuts: Ctrl+S / Cmd+S for instant saving, '/' to focus search, 'Escape' to clear search
      function handleGlobalKeydown_(e) {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") {
          e.preventDefault();
          saveNotes();
          return;
        }
        const activeTag =
          document.activeElement && document.activeElement.tagName
            ? document.activeElement.tagName.toLowerCase()
            : "";
        const isTyping =
          activeTag === "input" ||
          activeTag === "textarea" ||
          activeTag === "select";

        if (e.key === "/" && !isTyping) {
          e.preventDefault();
          const filterInput = document.getElementById("filter-input");
          if (filterInput) {
            filterInput.focus();
            if (typeof filterInput.select === "function") filterInput.select();
          }
        } else if (e.key === "Escape") {
          const filterInput = document.getElementById("filter-input");
          if (
            filterInput &&
            (document.activeElement === filterInput || filterInput.value)
          ) {
            filterInput.value = "";
            filterInput.blur();
            filterFiles("");
          }
        }
      }
      if (window._sofKeydownHandler) {
        document.removeEventListener("keydown", window._sofKeydownHandler);
      }
      window._sofKeydownHandler = handleGlobalKeydown_;
      document.addEventListener("keydown", window._sofKeydownHandler);

      // Cross-frame link interceptor for relative links inside GM screens
      window.addEventListener("message", (event) => {
        if (event.data && event.data.type === "OPEN_FILE_BY_NAME") {
          const filename = event.data.filename;
          const target = allFiles.find(
            (f) => f.simpleName === filename || f.name.endsWith(filename)
          );
          if (target) {
            loadFile(target.id);
          }
        }
      });

      function loadSessionDropdown() {
        google.script.run
          .withSuccessHandler((sessions) => {
            const select = document.getElementById("session-select");
            select.innerHTML = "";
            if (!sessions.includes(currentSessionDate)) {
              sessions.unshift(currentSessionDate);
            }
            sessions.forEach((folderName) => {
              const opt = document.createElement("option");
              opt.value = folderName;
              opt.textContent = folderName;
              if (folderName === currentSessionDate) opt.selected = true;
              select.appendChild(opt);
            });
          })
          .getSessionList();
      }

      function switchSession(newSessionDate) {
        currentSessionDate = newSessionDate;
        document.getElementById("file-list").innerHTML = "Loading files...";
        document.getElementById("scratchpad-label").textContent =
          "table_notes.md (" + currentSessionDate + ")";
        document.getElementById("scratchpad").value = "Loading table notes...";
        document.getElementById("save-status").textContent = "Loading...";

        refreshManifest();
        loadScratchpad();
      }

      function refreshManifest() {
        google.script.run
          .withSuccessHandler(renderManifest)
          .getSessionManifest(currentSessionDate);
      }

      function tokenizeStatblockAndDossier(fileMeta, rawContent = "") {
        const name = (fileMeta && fileMeta.name) || "";
        const simpleName = (fileMeta && fileMeta.simpleName) || name;
        const mimeType = (fileMeta && fileMeta.mimeType) || "";

        const tagMatches = name.match(/\[([^\]]+)\]/g) || [];
        const tags = tagMatches
          .map((t) => t.replace(/[[\]]/g, ""))
          .concat(mimeType)
          .join(" ");

        let title = simpleName.replace(/\.[^.]+$/, "").replace(/[_-]/g, " ");
        const propLines = [];

        if (rawContent) {
          const hMatch = rawContent.match(/^#{1,3}\s+(.+)$/m);
          if (hMatch) {
            title += " " + hMatch[1].trim();
          }

          const propRegex = /\*\*([^*]+)\*\*\s*(?:::|:)\s*([^\n\r]+)/g;
          let pMatch;
          while ((pMatch = propRegex.exec(rawContent)) !== null) {
            const propKey = pMatch[1].trim();
            const propVal = pMatch[2].trim();
            const extraSynonyms = /vulnerabilities/i.test(propKey)
              ? " vulnerability vulnerable"
              : /immunities/i.test(propKey)
                ? " immunity immune"
                : /resistances/i.test(propKey)
                  ? " resistance resistant"
                  : "";
            propLines.push(propKey + " " + propVal + extraSynonyms);
          }
        }

        return {
          id: fileMeta.id,
          name: name,
          simpleName: simpleName,
          mimeType: mimeType,
          title: title.trim(),
          tags: tags.trim(),
          properties: propLines.join(" | "),
          content: rawContent
        };
      }

      function indexFilePayload(payload) {
        if (!payload || !payload.id || !miniSearch) return;
        const existingMeta = allFiles.find((f) => f.id === payload.id) || {
          id: payload.id,
          name: payload.name || "",
          simpleName: payload.name || "",
          mimeType: payload.type || ""
        };
        const rawText =
          payload.type === "markdown" || payload.type === "html"
            ? payload.content || ""
            : "";
        const doc = tokenizeStatblockAndDossier(existingMeta, rawText);
        if (miniSearch.has(payload.id)) {
          miniSearch.replace(doc);
        } else {
          miniSearch.add(doc);
        }
      }

      function renderManifest(files) {
        allFiles = files;
        if (typeof MiniSearch !== "undefined") {
          miniSearch = new MiniSearch({
            fields: [
              "title",
              "tags",
              "properties",
              "content",
              "name",
              "simpleName",
              "mimeType"
            ],
            storeFields: ["id", "name", "simpleName", "mimeType"],
            tokenize: (text) =>
              text
                .toLowerCase()
                .split(/[\s_\-[\]./,:;|()]+/)
                .filter(Boolean),
            searchOptions: {
              boost: {
                title: 3.0,
                tags: 2.5,
                properties: 2.0,
                content: 1.0,
                name: 1.5,
                simpleName: 1.5
              },
              prefix: true,
              fuzzy: 0.2,
              combineWith: "AND"
            }
          });
          const docs = files.map((f) => {
            const cached = cache[f.id];
            const rawText =
              cached && (cached.type === "markdown" || cached.type === "html")
                ? cached.content
                : "";
            return tokenizeStatblockAndDossier(f, rawText);
          });
          miniSearch.addAll(docs);
        }
        AudioCache.preCacheManifest(files);
        filterFiles(document.getElementById("filter-input").value);
      }

      function filterFiles(query) {
        const list = document.getElementById("file-list");
        list.innerHTML = "";
        const q = query.toLowerCase().trim();

        let filtered = allFiles;
        if (q) {
          if (miniSearch) {
            const hits = miniSearch.search(q);
            const hitMap = new Map(allFiles.map((f) => [f.id, f]));
            filtered = hits.map((h) => hitMap.get(h.id)).filter(Boolean);
          } else {
            filtered = allFiles.filter((f) => f.name.toLowerCase().includes(q));
          }
        }

        if (filtered.length === 0) {
          list.innerHTML =
            '<div style="color:#777; font-size:12px; padding:10px;">No matching assets found.</div>';
          return;
        }

        filtered.forEach((f) => {
          const div = document.createElement("div");
          div.className = "file-item";
          div.onclick = () => loadFile(f.id, div);

          let icon = "📄";
          if (f.name.includes("[1. Floor Maps]")) icon = "🗺️";
          else if (f.name.includes("[3. Monsters]")) icon = "🐉";
          else if (f.name.includes("[2. Floor Specific")) icon = "💎";
          else if (f.mimeType.startsWith("image/")) icon = "🖼️";
          else if (f.mimeType.startsWith("audio/")) icon = "🎧";
          else if (f.name.endsWith(".html")) icon = "📑";
          else if (f.name.endsWith(".md")) icon = "📝";

          div.innerHTML = `<span class="file-icon">${icon}</span> <span>${f.name}</span>`;
          list.appendChild(div);
        });
      }

      function loadFile(fileId, element) {
        document
          .querySelectorAll(".file-item")
          .forEach((el) => el.classList.remove("active"));
        if (element) {
          element.classList.add("active");
        } else {
          // Highlight matching element if triggered from inside iframe link
          const matchingEl = Array.from(
            document.querySelectorAll(".file-item")
          ).find((el) => el.textContent.includes(fileId));
          if (matchingEl) matchingEl.classList.add("active");
        }

        if (cache[fileId] && cache[fileId].name !== "table_notes.md") {
          renderToLeftPane(cache[fileId]);
          return;
        }

        document.getElementById("left-title").textContent = "Loading...";
        document.getElementById("left-content").innerHTML =
          '<p style="color:var(--text-muted); text-align:center; margin-top:20vh;">Loading asset...</p>';

        google.script.run
          .withSuccessHandler((payload) => {
            cache[fileId] = payload;
            indexFilePayload(payload);
            renderToLeftPane(payload);
          })
          .getFilePayload(fileId, currentSessionDate);
      }

      function renderToLeftPane(payload) {
        currentLeftPayload = payload;
        document.getElementById("left-title").textContent = payload.name;
        document.getElementById("pin-btn").style.display = "inline-block";
        renderPayloadIntoContainer(
          payload,
          document.getElementById("left-content")
        );
      }

      function pinCurrentToRight() {
        if (!currentLeftPayload) return;
        const rightPane = document.getElementById("right-pane");
        rightPane.style.display = "flex";
        document.getElementById("right-title").textContent =
          "📌 " + currentLeftPayload.name;
        renderPayloadIntoContainer(
          currentLeftPayload,
          document.getElementById("right-content")
        );
      }

      function unpinRight() {
        document.getElementById("right-pane").style.display = "none";
        document.getElementById("right-content").innerHTML = "";
      }

      function parseCustomMarkdown(content) {
        let raw = content.trim();

        // 1. Strip outer code fences if file was saved as ```markdown ... ```
        if (raw.startsWith("```markdown") && raw.endsWith("```")) {
          raw = raw
            .replace(/^```markdown\s*/i, "")
            .replace(/\s*```$/i, "")
            .trim();
        }

        // 2. Parse 5e Homebrewery statblock tags
        if (
          raw.includes("{monster,frame") ||
          raw.includes("{monster,frame,wide")
        ) {
          raw = raw
            .replace(
              /\{monster,frame(?:,wide)?/gi,
              '<div class="dnd-statblock">\n\n'
            )
            .replace(/\n\}/g, "\n\n</div>");
        }

        // 3. Clean up statblock property lines: "**Armor Class** :: 17" -> "**Armor Class:** 17"
        raw = raw
          .replace(/\*\*([^*]+)\*\*\s*::\s*/g, "**$1:** ")
          .replace(/\{bonus \*\*([^*]+)\*\*\s*([^}]+)\}/g, "(**$1** $2)");

        // 4. Render marked
        return marked.parse(raw);
      }

      function prepareHtmlSrcdoc(htmlContent) {
        const injection = `
        <base target="_self">
        <script>
          (function() {
            function initNavInterceptors() {
              document.addEventListener('click', function(e) {
                var a = e.target.closest('a');
                if (!a) return;
                var href = a.getAttribute('href');
                if (!href) return;

                // 1. Internal hash jumps (#lore, #setup, #phases, #radar, etc.)
                if (href.startsWith('#')) {
                  e.preventDefault();
                  e.stopPropagation();
                  var targetId = href.substring(1);
                  if (!targetId) return;
                  var el = document.getElementById(targetId) || document.querySelector('[name="' + targetId + '"]');
                  if (el) {
                    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
                  }
                  return;
                }

                // 2. Relative file links to companion handouts
                if (!href.startsWith('http://') && !href.startsWith('https://') && !href.startsWith('mailto:') && !href.startsWith('javascript:') && !href.startsWith('tel:')) {
                  e.preventDefault();
                  e.stopPropagation();
                  var filename = href.split('/').pop().split('?')[0].split('#')[0];
                  window.parent.postMessage({ type: 'OPEN_FILE_BY_NAME', filename: filename }, '*');
                  return;
                }

                // 3. External links: force target="_blank"
                if (href.startsWith('http://') || href.startsWith('https://')) {
                  a.setAttribute('target', '_blank');
                }
              }, true);
            }

            if (document.readyState === 'loading') {
              document.addEventListener('DOMContentLoaded', initNavInterceptors);
            } else {
              initNavInterceptors();
            }
          })();
        <\/script>
      `;

        if (htmlContent.includes("<head>")) {
          return htmlContent.replace("<head>", "<head>\n" + injection);
        } else {
          return injection + htmlContent;
        }
      }

      function createDrivePreviewIframe(srcUrl, height = "calc(100vh - 90px)") {
        const iframe = document.createElement("iframe");
        iframe.src = srcUrl;
        iframe.style.width = "100%";
        iframe.style.height = height;
        iframe.style.border = "1px solid var(--border)";
        iframe.style.borderRadius = "6px";
        return iframe;
      }

      function renderPayloadIntoContainer(payload, container) {
        container.innerHTML = "";
        if (payload.type === "image") {
          const img = document.createElement("img");
          img.className = "asset-img";
          img.src = payload.content;
          img.onerror = function () {
            // Graceful fallback to Drive preview iframe if unshared or direct link blocked
            container.innerHTML = "";
            container.appendChild(
              createDrivePreviewIframe(
                "https://drive.google.com/file/d/" + payload.id + "/preview"
              )
            );
          };
          container.appendChild(img);
        } else if (
          payload.type === "image-preview" ||
          payload.type === "audio"
        ) {
          const height =
            payload.type === "audio" ? "140px" : "calc(100vh - 90px)";
          container.appendChild(
            createDrivePreviewIframe(payload.content, height)
          );
        } else if (payload.type === "markdown") {
          const div = document.createElement("div");
          div.className = "markdown-body";
          div.innerHTML = parseCustomMarkdown(payload.content);
          div.querySelectorAll("img").forEach((img) => {
            img.onerror = function () {
              const match = img.src.match(/\/d\/([a-zA-Z0-9_-]+)/);
              if (match) {
                const fallback = document.createElement("a");
                fallback.href =
                  "https://drive.google.com/file/d/" + match[1] + "/view";
                fallback.target = "_blank";
                fallback.style.cssText =
                  "display:inline-block; padding:4px 8px; margin:4px 0; background:#334155; color:#38bdf8; border-radius:4px; font-size:12px; text-decoration:none;";
                fallback.textContent =
                  "🗺️ [Open in Drive: " + (img.alt || "Asset") + "]";
                img.replaceWith(fallback);
              }
            };
          });
          container.appendChild(div);
        } else if (payload.type === "html") {
          const iframe = document.createElement("iframe");
          iframe.className = "sandbox-frame";
          iframe.srcdoc = prepareHtmlSrcdoc(payload.content);
          container.appendChild(iframe);
        }
      }

      // Scratchpad Live Operations
      function loadScratchpad() {
        google.script.run
          .withSuccessHandler((res) => {
            document.getElementById("scratchpad").value = res.content;
            document.getElementById("save-status").textContent =
              "Loaded: " + res.updated;
          })
          .getScratchpadNotes(currentSessionDate);
      }

      function saveNotes() {
        const content = document.getElementById("scratchpad").value;
        const status = document.getElementById("save-status");
        status.textContent = "Saving...";

        flushAudioTimeline();
        google.script.run
          .withSuccessHandler((res) => {
            status.textContent = "Saved at " + res.updated;
            if (res.id && cache[res.id]) {
              delete cache[res.id];
            }
            refreshManifest();
          })
          .saveScratchpadNotes(currentSessionDate, content);
      }

      // Ticket 04: IndexedDB Audio Pre-Caching Engine
      const AudioCache = {
        dbName: "sof_audio_cache_v1",
        storeName: "tracks",
        memoryStore: new Map(),
        openDb_() {
          return new Promise((resolve) => {
            if (
              typeof window === "undefined" ||
              !window.indexedDB ||
              typeof window.indexedDB.open !== "function"
            ) {
              resolve(null);
              return;
            }
            try {
              const req = window.indexedDB.open(this.dbName, 1);
              req.onupgradeneeded = () => {
                const db = req.result;
                if (
                  db &&
                  db.objectStoreNames &&
                  !db.objectStoreNames.contains(this.storeName)
                ) {
                  db.createObjectStore(this.storeName);
                }
              };
              req.onsuccess = () => resolve(req.result || null);
              req.onerror = () => resolve(null);
            } catch (_e) {
              resolve(null);
            }
          });
        },
        async has(fileId) {
          if (this.memoryStore.has(fileId)) return true;
          const val = await this.get(fileId);
          return val !== undefined && val !== null;
        },
        async get(fileId) {
          if (this.memoryStore.has(fileId)) {
            return this.memoryStore.get(fileId);
          }
          const db = await this.openDb_();
          if (!db) return undefined;
          return new Promise((resolve) => {
            try {
              const tx = db.transaction(this.storeName, "readonly");
              const store = tx.objectStore(this.storeName);
              const req = store.get(fileId);
              req.onsuccess = () => {
                if (req.result !== undefined && req.result !== null) {
                  this.memoryStore.set(fileId, req.result);
                }
                resolve(req.result);
              };
              req.onerror = () => resolve(undefined);
            } catch (_e) {
              resolve(undefined);
            }
          });
        },
        async set(fileId, arrayBuffer) {
          this.memoryStore.set(fileId, arrayBuffer);
          const db = await this.openDb_();
          if (!db) return;
          return new Promise((resolve) => {
            try {
              const tx = db.transaction(this.storeName, "readwrite");
              const store = tx.objectStore(this.storeName);
              const req = store.put(arrayBuffer, fileId);
              req.onsuccess = () => resolve();
              req.onerror = () => resolve();
            } catch (_e) {
              resolve();
            }
          });
        },
        async fetchAudioBytes_(fileMeta) {
          const url =
            (fileMeta && fileMeta.downloadUrl) ||
            "https://drive.google.com/uc?export=download&id=" + fileMeta.id;
          if (
            typeof window !== "undefined" &&
            typeof window.fetch === "function"
          ) {
            try {
              const res = await window.fetch(url);
              if (res && res.ok && typeof res.arrayBuffer === "function") {
                return await res.arrayBuffer();
              }
            } catch (_e) {}
          }
          return new ArrayBuffer(0);
        },
        async preCacheManifest(files) {
          const audioFiles = (files || []).filter(
            (f) =>
              (f.mimeType && f.mimeType.startsWith("audio/")) ||
              (f.name && /\.(mp3|wav|m4a|ogg)$/i.test(f.name))
          );
          let ready = 0;
          for (let i = 0; i < audioFiles.length; i++) {
            const af = audioFiles[i];
            if (!(await this.has(af.id))) {
              const bytes = await this.fetchAudioBytes_(af);
              await this.set(af.id, bytes);
            }
            ready++;
          }
          const statusEl = document.getElementById("audio-cache-status");
          if (statusEl) {
            statusEl.textContent =
              "Audio: " + ready + "/" + audioFiles.length + " ready";
          }
          return ready;
        }
      };

      // Ticket 05 & 06: 3-Channel Web Audio API Mixer, Gain Ducking & Sidecar Logger
      function createGainNode_(ctx, initialGain = 1.0) {
        if (ctx && typeof ctx.createGain === "function") {
          const nativeNode = ctx.createGain();
          if (ctx.destination && typeof nativeNode.connect === "function") {
            nativeNode.connect(ctx.destination);
          }
          const origSet =
            nativeNode.gain &&
            typeof nativeNode.gain.setValueAtTime === "function"
              ? nativeNode.gain.setValueAtTime.bind(nativeNode.gain)
              : null;
          const origRamp =
            nativeNode.gain &&
            typeof nativeNode.gain.linearRampToValueAtTime === "function"
              ? nativeNode.gain.linearRampToValueAtTime.bind(nativeNode.gain)
              : null;
          nativeNode.gain.value = initialGain;
          nativeNode.gain.setValueAtTime = function (val, time) {
            this.value = val;
            if (origSet) origSet(val, time);
          };
          nativeNode.gain.linearRampToValueAtTime = function (val, time) {
            this.value = val;
            if (origRamp) origRamp(val, time);
          };
          return nativeNode;
        }
        return {
          gain: {
            value: initialGain,
            setValueAtTime(val) {
              this.value = val;
            },
            linearRampToValueAtTime(val) {
              this.value = val;
            }
          }
        };
      }

      const TabletopMixer = {
        ctx: null,
        channel1Gain: createGainNode_(null, 0.2),
        channel2Gain: createGainNode_(null, 1.0),
        channel3Gain: createGainNode_(null, 1.0),
        timeline: [],
        duckTimer: null,
        init() {
          const AudioCtxCtor =
            typeof window !== "undefined"
              ? window.AudioContext || window.webkitAudioContext
              : null;
          this.ctx =
            typeof AudioCtxCtor === "function" ? new AudioCtxCtor() : null;
          this.channel1Gain = createGainNode_(this.ctx, 0.2);
          this.channel2Gain = createGainNode_(this.ctx, 1.0);
          this.channel3Gain = createGainNode_(this.ctx, 1.0);
          this.timeline = [];
        },
        now_() {
          return this.ctx && typeof this.ctx.currentTime === "number"
            ? this.ctx.currentTime
            : 0;
        },
        playBufferOnChannel_(trackId, gainNode, loop = false) {
          if (
            !this.ctx ||
            typeof this.ctx.decodeAudioData !== "function" ||
            typeof this.ctx.createBufferSource !== "function"
          ) {
            return;
          }
          const rawBuf = AudioCache.memoryStore.get(trackId);
          if (!rawBuf || rawBuf.byteLength === 0) return;
          try {
            const copy = rawBuf.slice(0);
            this.ctx.decodeAudioData(copy, (decoded) => {
              if (!decoded) return;
              const src = this.ctx.createBufferSource();
              src.buffer = decoded;
              src.loop = loop;
              if (typeof src.connect === "function") src.connect(gainNode);
              if (typeof src.start === "function") src.start(0);
            });
          } catch (_e) {}
        },
        playAmbience(trackId) {
          this.channel1Gain.gain.setValueAtTime(0.2, this.now_());
          this.playBufferOnChannel_(trackId, this.channel1Gain, true);
          this.timeline.push({
            timestamp: Date.now(),
            track: trackId,
            channel: 1,
            eventType: "LOOP",
            gain: 0.2
          });
        },
        crossfadeScore(trackId) {
          const now = this.now_();
          this.channel2Gain.gain.linearRampToValueAtTime(0.0, now + 2.0);
          this.channel2Gain.gain.linearRampToValueAtTime(1.0, now + 4.0);
          this.playBufferOnChannel_(trackId, this.channel2Gain, true);
          this.timeline.push({
            timestamp: Date.now(),
            track: trackId,
            channel: 2,
            eventType: "CROSSFADE",
            gain: 1.0
          });
        },
        playSfx(sfxId) {
          const DUCKED_GAIN = 0.4;
          const NORMAL_GAIN = 1.0;
          this.channel2Gain.gain.linearRampToValueAtTime(
            DUCKED_GAIN,
            this.now_() + 0.1
          );
          this.playBufferOnChannel_(sfxId, this.channel3Gain, false);
          this.timeline.push({
            timestamp: Date.now(),
            track: sfxId,
            channel: 3,
            eventType: "SFX",
            gain: DUCKED_GAIN
          });
          if (this.duckTimer) clearTimeout(this.duckTimer);
          this.duckTimer = setTimeout(() => {
            this.channel2Gain.gain.linearRampToValueAtTime(
              NORMAL_GAIN,
              this.now_() + 0.4
            );
            this.timeline.push({
              timestamp: Date.now(),
              track: sfxId,
              channel: 2,
              eventType: "RESTORE",
              gain: NORMAL_GAIN
            });
          }, 1500);
        }
      };

      function flushAudioTimeline() {
        if (!TabletopMixer.timeline || TabletopMixer.timeline.length === 0) {
          return;
        }
        const jsonStr = JSON.stringify(TabletopMixer.timeline);
        if (
          typeof google !== "undefined" &&
          google.script &&
          google.script.run
        ) {
          const runner = google.script.run.withSuccessHandler(() => {});
          if (runner && typeof runner.saveAudioTimeline === "function") {
            runner.saveAudioTimeline(currentSessionDate, jsonStr);
          } else if (
            typeof google.script.run.saveAudioTimeline === "function"
          ) {
            google.script.run.saveAudioTimeline(currentSessionDate, jsonStr);
          }
        }
      }

      // Tickets 07 & 08: Mobile Player Companion HUD & PTT Rules Sniffer
      const DEFAULT_GLOSSARY = {
        disadvantage: {
          title: "Disadvantage",
          type: "Core Mechanic",
          text: "Roll two d20s and take the lower result."
        },
        advantage: {
          title: "Advantage",
          type: "Core Mechanic",
          text: "Roll two d20s and take the higher result."
        },
        concentration: {
          title: "Concentration",
          type: "Core Mechanic",
          text: "Constitution saving throw (DC 10 or half damage) required to maintain spell."
        },
        exhaustion: {
          title: "Exhaustion",
          type: "Condition",
          text: "Cumulative -1 penalty per level to d20 tests and speed."
        },
        teleport: {
          title: "Teleport",
          type: "7th-Level Spell",
          text: "Instantly transport up to 8 willing creatures to a known destination."
        }
      };

      let pttTimer = null;
      let ruleCardTimer = null;
      let activeRuleCard = null;
      let activeSpeechRecognition = null;

      function selectPlayerIdentity(playerName) {
        try {
          if (typeof localStorage !== "undefined" && localStorage) {
            localStorage.setItem("sof_player_identity", playerName);
          }
        } catch (_e) {}
        const tag = document.getElementById("player-tag");
        if (tag) tag.textContent = "Player: " + playerName;
        const modal = document.getElementById("identity-modal");
        if (modal) modal.style.display = "none";
      }

      function matchSpokenRuleQuery_(transcript) {
        if (!transcript) return null;
        const lower = transcript.toLowerCase();
        const keys = Object.keys(DEFAULT_GLOSSARY);
        for (let i = 0; i < keys.length; i++) {
          const key = keys[i];
          if (lower.includes(key)) {
            return {
              key: key,
              entry: DEFAULT_GLOSSARY[key]
            };
          }
        }
        return null;
      }

      function triggerPtt() {
        const btn = document.getElementById("ptt-btn");
        if (!btn) return;
        if (btn.classList.contains("listening")) {
          stopPtt();
          return;
        }
        btn.classList.add("listening");
        btn.textContent = "🔴 Listening (4s)...";

        const SpeechRecognitionCtor =
          typeof window !== "undefined"
            ? window.SpeechRecognition || window.webkitSpeechRecognition
            : null;
        if (typeof SpeechRecognitionCtor === "function") {
          try {
            activeSpeechRecognition = new SpeechRecognitionCtor();
            activeSpeechRecognition.continuous = false;
            activeSpeechRecognition.interimResults = false;
            activeSpeechRecognition.lang = "en-US";
            activeSpeechRecognition.onresult = (event) => {
              const transcript =
                event &&
                event.results &&
                event.results[0] &&
                event.results[0][0] &&
                event.results[0][0].transcript
                  ? event.results[0][0].transcript
                  : "";
              const matched = matchSpokenRuleQuery_(transcript);
              if (matched) {
                showRuleCard(
                  matched.entry.title,
                  matched.entry.text,
                  transcript.toLowerCase()
                );
              }
              stopPtt();
            };
            activeSpeechRecognition.onerror = () => stopPtt();
            if (typeof activeSpeechRecognition.start === "function") {
              activeSpeechRecognition.start();
            }
          } catch (_e) {}
        }

        if (pttTimer) clearTimeout(pttTimer);
        pttTimer = setTimeout(() => {
          stopPtt();
        }, 4000);
      }

      function stopPtt() {
        if (pttTimer) clearTimeout(pttTimer);
        if (
          activeSpeechRecognition &&
          typeof activeSpeechRecognition.stop === "function"
        ) {
          try {
            activeSpeechRecognition.stop();
          } catch (_e) {}
        }
        activeSpeechRecognition = null;
        const btn = document.getElementById("ptt-btn");
        if (btn) {
          btn.classList.remove("listening");
          btn.textContent = "🎙️ Tap to Ask Rule";
        }
      }

      function showRuleCard(ruleTitle, ruleText, heardPhrase = "") {
        const card = document.getElementById("rule-card");
        const titleEl = document.getElementById("card-title");
        const textEl = document.getElementById("card-text");
        if (!card || !titleEl) return;
        activeRuleCard = {
          cardTitle: ruleTitle,
          text: ruleText,
          phrase: heardPhrase || ruleTitle.toLowerCase()
        };
        titleEl.textContent = ruleTitle;
        if (textEl) textEl.textContent = ruleText;
        card.style.display = "block";
        if (ruleCardTimer) clearTimeout(ruleCardTimer);
        ruleCardTimer = setTimeout(() => {
          dismissRuleCard();
        }, 30000);
      }

      function dismissRuleCard() {
        if (ruleCardTimer) clearTimeout(ruleCardTimer);
        const card = document.getElementById("rule-card");
        if (card) card.style.display = "none";
      }

      function submitRuleFeedback(vote) {
        let player = "Guest";
        try {
          if (typeof localStorage !== "undefined" && localStorage) {
            player = localStorage.getItem("sof_player_identity") || "Guest";
          }
        } catch (_e) {}
        const payload = {
          player: player,
          phrase: (activeRuleCard && activeRuleCard.phrase) || "",
          cardTitle: (activeRuleCard && activeRuleCard.cardTitle) || "",
          vote: vote
        };
        if (
          typeof google !== "undefined" &&
          google.script &&
          google.script.run &&
          typeof google.script.run.logRuleFeedback === "function"
        ) {
          google.script.run.logRuleFeedback(payload);
        }
        dismissRuleCard();
      }

      // Ticket 12: In-Browser WebGPU Gemma 4 E2B Audio Intent Classifier Router
      function hasWebGpuSupport() {
        return Boolean(
          typeof window !== "undefined" &&
            window.navigator &&
            window.navigator.gpu
        );
      }

      function handleAudioIntent(intentPayload) {
        if (!intentPayload || !intentPayload.intent) return;
        if (intentPayload.intent === "MUSIC_CUE" && intentPayload.mood) {
          TabletopMixer.crossfadeScore(intentPayload.mood);
        } else if (
          intentPayload.intent === "RULE_QUERY" &&
          intentPayload.rule
        ) {
          const key = intentPayload.rule.toLowerCase();
          const matched = DEFAULT_GLOSSARY[key] || {
            title: intentPayload.rule,
            type: "Rule",
            text: "Matched table query: " + intentPayload.rule
          };
          showRuleCard(matched.title, matched.text, key);
        }
      }

      window.addEventListener("message", (event) => {
        if (
          event &&
          event.data &&
          event.data.type === "SOF_AUDIO_INTENT" &&
          event.data.payload
        ) {
          handleAudioIntent(event.data.payload);
        }
      });
    </script>
